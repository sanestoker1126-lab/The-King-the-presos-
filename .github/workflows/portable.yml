name: Juego compilado para Windows

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/serve-offline.ps1"
      - "JUGAR_EN_WINDOWS.cmd"
      - "README-JUGAR.md"
      - ".github/workflows/portable.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Preparar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Comprobar recursos y motor
        run: |
          npm run verify:assets
          npm test
      - name: Compilar para servidor local
        run: npx vite build --base=./ --outDir=dist-portable
      - name: Empaquetar juego jugable
        run: |
          cp scripts/serve-offline.ps1 dist-portable/servidor.ps1
          cp JUGAR_EN_WINDOWS.cmd dist-portable/JUGAR_EN_WINDOWS.cmd
          cp README-JUGAR.md dist-portable/LEEME.txt
          cd dist-portable
          zip -q -r ../Legend_of_Presos_JUGAR_Windows.zip .
          cd ..
          unzip -t Legend_of_Presos_JUGAR_Windows.zip | tail -n 1
          test -s Legend_of_Presos_JUGAR_Windows.zip
      - name: Publicar paquete descargable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Legend_of_Presos_JUGAR_Windows
          path: Legend_of_Presos_JUGAR_Windows.zip
          if-no-files-found: error
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh release create "inicio-corregido-$SHORT_SHA" \
            Legend_of_Presos_JUGAR_Windows.zip \
            --title "Legend of Presos - inicio corregido $SHORT_SHA" \
            --notes "Juego compilado para Windows. Extraer ZIP y ejecutar JUGAR_EN_WINDOWS.cmd. No necesita Node ni Python."
